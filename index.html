<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Młyn o Siano 🌾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- EDIT TEAM MODAL -->
<div id="edit-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2 id="modal-team-name">Edytuj drużynę</h2>
    <label>Kredyty</label>
    <input type="number" id="modal-credits" min="0">
    <label>Tokeny</label>
    <input type="number" id="modal-tokens" min="0">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Anuluj</button>
      <button class="btn-primary" onclick="saveModal()">Zapisz</button>
    </div>
  </div>
</div>

<!-- TOP BAR -->
<header id="top-bar">
  <div id="top-left">
    <span class="label">Runda</span>
    <span id="round-display" class="value">1</span>
    <span class="sep">/</span>
    <span id="question-display" class="value">1</span>
    <span class="label">pyt.</span>
  </div>
  <div id="top-center">
    <div id="category-display" class="category-badge">—</div>
  </div>
  <div id="top-right">
    <button id="btn-undo" class="btn-undo" onclick="undo()">↩ Cofnij</button>
  </div>
</header>

<div id="app-layout">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-block">
      <div class="sidebar-label">Podkategoria</div>
      <div id="sidebar-subcategory" class="sidebar-value">—</div>
    </div>
    <div class="sidebar-block">
      <div class="sidebar-label">Pula pytania</div>
      <div id="sidebar-pool" class="sidebar-pool">0</div>
    </div>

    <div id="teams-list"></div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main-content">

    <!-- INIT SCREEN -->
    <div id="screen-init" class="screen active">
      <div class="init-box">
        <div class="game-logo">🌾</div>
        <h1 class="game-title">Młyn o Siano</h1>
        <p class="game-subtitle">Teleturniej imprezowy</p>
        <button class="btn-giant" onclick="initGame()">Rozpocznij grę</button>
      </div>
    </div>

    <!-- DRAW SCREEN -->
    <div id="screen-draw" class="screen">
      <div id="draw-container">
        <div id="wheel-area">
          <div id="category-spinner">
            <div id="spinner-text">?</div>
          </div>
          <div id="spinner-arrow">▼</div>
        </div>
        <div id="draw-actions">
          <button id="btn-draw" class="btn-giant" onclick="drawCategory()">🎡 Losuj kategorię</button>
          <button id="btn-confirm-draw" class="btn-giant btn-green hidden" onclick="confirmDraw()">Licytacja →</button>
        </div>
      </div>
    </div>

    <!-- BID SCREEN -->
    <div id="screen-bid" class="screen">
      <div class="bid-container">
        <h2 class="bid-title">💰 Licytacja</h2>
        <div id="bid-rows"></div>
        <button id="btn-confirm-bids" class="btn-giant btn-green" onclick="confirmBids()" disabled>Zatwierdź licytację</button>
      </div>
    </div>

    <!-- SUBCATEGORY SCREEN -->
    <div id="screen-subcategory" class="screen">
      <div class="subcategory-container">
        <h2 class="sub-title">Wybierz podkategorię</h2>
        <div id="subcategory-buttons"></div>
      </div>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="screen">
      <div class="question-container">
        <div id="question-text" class="question-text"></div>
        <div id="abcd-options" class="abcd-options hidden"></div>
        <div id="question-actions" class="question-actions">
          <button id="btn-hint" class="btn-action btn-blue" onclick="useHint()"></button>
          <button id="btn-change-sub" class="btn-action btn-yellow" onclick="changeSub()">↩ Zmień podkategorię</button>
          <button id="btn-correct" class="btn-action btn-green" onclick="correctAnswer()"></button>
          <button id="btn-pass" class="btn-action btn-red" onclick="passQuestion()">→ Przejście (+1 token)</button>
        </div>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div id="screen-summary" class="screen">
      <div class="summary-container">
        <div id="summary-text" class="summary-text"></div>
        <button class="btn-giant btn-green" onclick="confirmSummary()">Zatwierdź ✓</button>
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="screen-gameover" class="screen">
      <div class="gameover-container">
        <h1 class="gameover-title">🏆 Koniec Gry!</h1>
        <div id="final-table"></div>
        <button class="btn-giant" onclick="initGame()" style="margin-top:2rem">Zagraj ponownie</button>
      </div>
    </div>

  </main>
</div>

<script src="/js/app.js"></script>
</body>
</html>
